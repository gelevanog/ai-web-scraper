# Sift: PostgreSQL, the API, the worker (with headless Chromium), the dashboard and a static server for the
# synthetic web (47 fictional sites on reserved .example domains).
#   docker compose up --build
#     dashboard     http://localhost:3000
#     API           http://localhost:8000   (OpenAPI docs at /docs)
#     synthetic web http://localhost:8090   (browse /<domain>/...)
# With no keys the offline model runs the demo. For free cloud models put OPENROUTER_API_KEY and
# SIFT_LLM_PROVIDER=openrouter in .env (see README > Run with free models via OpenRouter).
name: sift

x-backend: &backend
  build: .
  image: sift-api:latest
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    SIFT_DATABASE_URL: postgresql://sift:${POSTGRES_PASSWORD:-sift}@postgres:5432/sift
    SIFT_LLM_PROVIDER: ${SIFT_LLM_PROVIDER:-fake}
    SIFT_SYNTHETIC_WEB_URL: http://synthetic-web:8090
    SIFT_CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
  volumes:
    - synthweb:/app/data/synthetic_web
    - llmcache:/home/app/.cache
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sift}
      POSTGRES_DB: sift
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    environment:
      <<: *backend-env
      SIFT_SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *backend
    command: ["sift", "--log-level", "INFO", "worker"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      synthetic-web:
        condition: service_started

  synthetic-web:
    <<: *backend
    # Generated by the API on first start into the shared volume; served by Host header (the worker) or by path.
    command: ["sift", "synthetic-server", "--port", "8090"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SYNTHETIC_WEB_PORT:-8090}:8090"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    image: sift-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  synthweb:
  llmcache:
