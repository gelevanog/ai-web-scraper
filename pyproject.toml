[project]
name = "sift"
version = "0.1.0"
description = "Sift: describe the data you want, get clean structured JSON from any website. Learns deterministic extractors from a plain-English request, validates and normalizes every record with provenance, and heals itself when the layout changes. Polite by default."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "cssselect>=1.3",
    "fastapi",
    "httpx",
    "lxml>=5.3",
    "playwright>=1.50",
    "psycopg[binary]",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "pypdf>=5",
    "python-dateutil",
    "pyyaml",
    "rich",
    "sqlalchemy>=2.0",
    "structlog",
    "typer",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["mypy", "pytest", "ruff", "types-pyyaml", "types-python-dateutil", "lxml-stubs"]

[project.scripts]
sift = "sift.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser: needs a Chromium for Playwright (skipped when none is installed)",
    "postgres: needs PostgreSQL (TEST_DATABASE_URL); skipped otherwise",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TC", "S608"]
# E501: `ruff format` owns line length; what it cannot wrap are long regex and prompt strings, kept intact on purpose.
ignore = ["E501", "TC001", "TC002", "TC003", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sift"]

[[tool.mypy.overrides]]
module = ["cssselect.*", "pyarrow.*", "pypdf.*"]
ignore_missing_imports = true
